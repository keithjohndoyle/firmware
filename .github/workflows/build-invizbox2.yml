name: Build InvizBox 2 firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils python3-setuptools rsync \
            unzip zlib1g-dev file wget libelf-dev ecj fastjar swig

      - name: Regenerate NordVPN servers and templates
        run: python3 -I resources/gen_nordvpn.py

      - name: Build InvizBox 2 image
        run: |
          ./build.sh 2 || {
            echo "::group::verbose retry of the failing package"
            cd openwrt
            make -j1 V=s package/firmware/cypress-firmware/download package/firmware/cypress-firmware/compile 2>&1 | tail -80
            echo "::endgroup::"
            exit 1
          }

      - name: Checksums
        run: |
          cd output
          ls -la
          sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: invizbox2-firmware
          path: output/*
          retention-days: 30
